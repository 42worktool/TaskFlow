services:
  nginx:
    # 발급 스크립트가 준비한 인증서 디렉터리를 nginx의 고정 경로에 연결한다.
    volumes:
      - ${TLS_CERT_DIR:-./.taskflow/tls}:/etc/nginx/ssl
    restart: always

  frontend:
    build:
      target: production
    restart: always

  backend:
    build:
      target: production
    volumes:
      # 컨테이너 교체 시에도 사용자 업로드가 사라지지 않게 이름 있는 볼륨을 사용한다.
      - prod_uploads_data:/app/uploads
    restart: always

  postgres:
    restart: always

  redis:
    restart: always

volumes:
  prod_uploads_data:
