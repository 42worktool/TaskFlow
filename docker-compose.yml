networks:
  app-network:
    driver: bridge

services:
  # 1. 외부 HTTPS 진입점과 프론트·백엔드 라우팅을 담당한다.
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${HTTPS_PORT:-4430}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  # 2. Vue 개발/정적 프론트엔드를 내부 5173 포트로 노출한다.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "5173"
    networks:
      - app-network

  # 3. API와 WebSocket을 제공하며 DB·Redis가 준비된 뒤 시작한다.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      ALLOW_DB_SEED: ${ALLOW_DB_SEED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      OAUTH_AUTO_LINK_VERIFIED_EMAIL: ${OAUTH_AUTO_LINK_VERIFIED_EMAIL:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      WS_AUTH_TIMEOUT_MS: ${WS_AUTH_TIMEOUT_MS:-10000}
      WS_HEARTBEAT_INTERVAL_MS: ${WS_HEARTBEAT_INTERVAL_MS:-30000}
      WS_MAX_PAYLOAD_BYTES: ${WS_MAX_PAYLOAD_BYTES:-65536}
      WS_MAX_MESSAGES_PER_MINUTE: ${WS_MAX_MESSAGES_PER_MINUTE:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # 4. 영속 업무 데이터를 이름 있는 볼륨에 저장한다.
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  # 5. refresh session·초대·메일 큐·rate limit 같은 일시 상태를 환경과 무관하게 보존한다.
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
