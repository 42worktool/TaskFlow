networks:
  app-network:
    driver: bridge

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: app_nginx
    ports:
      - "4430:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: always

  # 2. Frontend (Vue.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # 리눅스 환경에서 파일 변경 감지 안정화
    networks:
      - app-network

  # 3. Backend (Node.js + TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres:5432/mydb
      - REDIS_URL=redis://redis:6379
      - APP_ORIGIN=${APP_ORIGIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - OAUTH_AUTO_LINK_VERIFIED_EMAIL=${OAUTH_AUTO_LINK_VERIFIED_EMAIL:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - WS_AUTH_TIMEOUT_MS=${WS_AUTH_TIMEOUT_MS:-10000}
      - WS_HEARTBEAT_INTERVAL_MS=${WS_HEARTBEAT_INTERVAL_MS:-30000}
      - WS_MAX_PAYLOAD_BYTES=${WS_MAX_PAYLOAD_BYTES:-65536}
      - WS_MAX_MESSAGES_PER_MINUTE=${WS_MAX_MESSAGES_PER_MINUTE:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # 4. Main Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: app_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: always

  # 5. In-Memory Database (Redis)
  redis:
    image: redis:7-alpine
    container_name: app_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: always

volumes:
  postgres_data:
  redis_data:
