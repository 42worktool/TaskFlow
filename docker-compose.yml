version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    image: nginx:stable-alpine
    container_name: app_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: always

  # 2. Frontend (Vue.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # 리눅스 환경에서 파일 변경 감지 안정화
    networks:
      - app-network

  # 3. Backend (Node.js + TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres:5432/mydb
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # 4. Main Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: app_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

  # 5. In-Memory Database (Redis)
  redis:
    image: redis:7-alpine
    container_name: app_redis
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: always

volumes:
  postgres_data:
  redis_data:
